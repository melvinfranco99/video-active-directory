<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crear usuario en Active Directory</title>
<meta name="description" content="Video animado: cómo abrir Active Directory y crear un usuario paso a paso.">
<meta name="theme-color" content="#0A0F2C">
<style>
  :root { --bg:#0A0F2C; --bg2:#190F3D; --fg:#F8FAFC; --muted:#CBD5E1; --cyan:#22D3EE; --violet:#8B5CF6; --pink:#F472B6; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(160deg,var(--bg),var(--bg2)); color:var(--fg);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; align-items:center; padding:24px 16px 40px; }
  h1 { font-size:clamp(1.4rem,5vw,2rem); margin:8px 0 4px; text-align:center; }
  p.sub { color:var(--muted); margin:0 0 20px; text-align:center; }
  .player { width:100%; max-width:420px; aspect-ratio:9/16; border-radius:22px; overflow:hidden;
            box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 0 2px rgba(34,211,238,.35); background:#000; }
  video { width:100%; height:100%; display:block; object-fit:cover; }
  .actions { display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; justify-content:center; }
  a.btn { color:#fff; text-decoration:none; padding:12px 20px; border-radius:999px; font-weight:700;
          background:linear-gradient(90deg,var(--cyan),var(--violet)); }
  a.btn.alt { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); }
  footer { margin-top:28px; color:var(--muted); font-size:.85rem; text-align:center; }
</style>
</head>
<body>
  <h1>Crear un usuario en Active Directory</h1>
  <p class="sub">Tutorial animado · 55 segundos · formato vertical</p>
  <div class="player">
    <video src="video.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
  </div>
  <div class="actions">
    <a class="btn" href="video.mp4" download>Descargar MP4</a>
    <a class="btn alt" href="render.py">Código de la animación</a>
  </div>
  <footer>1080×1920 · 30 fps · listo para Reels, Shorts y TikTok</footer>
</body>
</html>
